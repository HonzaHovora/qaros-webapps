name: CI

# Pull requests: tooling tests, `qaros-adaptation check` and `test` on every adaptation against the
# QAROS adaptation kit of release.json's minQarosVersion (Quaternar/qaros at tag v<minQarosVersion>,
# else its default branch), version bumps against the previous release, and the unsigned packages
# and index built and verified. Nothing is signed or published here. Steps are scripts/ci.py calls.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags, for the version check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Adaptation kit ref (tag v<minQarosVersion>, else the default branch)
        id: kit
        run: python3 -I scripts/ci.py kit-ref --github-output "$GITHUB_OUTPUT"

      - name: Checkout the adaptation kit (Quaternar/qaros)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quaternar/qaros
          ref: ${{ steps.kit.outputs.ref }}
          path: .qaros
          persist-credentials: false

      - name: Tests, kit check and test per adaptation, version bumps
        run: python3 -I scripts/ci.py check --kit .qaros/adaptation-kit

      - name: Build and verify packages (unsigned)
        run: python3 -I scripts/build_packages.py --out out --kit .qaros/adaptation-kit

      - name: Index (unsigned)
        run: |
          today=$(date -u +%Y.%m.%d)
          last=$(git tag --list "$today.*" | sed "s/^$today\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          tag="$today.$(( ${last:-0} + 1 ))"
          python3 -I scripts/make_index.py build --packages out --release "$tag" --out out/webapps-index.json --kit .qaros/adaptation-kit
          python3 -I scripts/make_index.py verify out/webapps-index.json --packages out --kit .qaros/adaptation-kit

      - name: Upload unsigned packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-packages
          path: |
            out/*.qarapp
            out/webapps-index.json
          retention-days: 7
          if-no-files-found: error
